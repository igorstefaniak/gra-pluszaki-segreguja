      <path d="M837 367C874 356 922 352 978 352H1182C1231 352 1266 358 1288 367" stroke="#B87911" stroke-opacity="0.20" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="948" cy="344" rx="126" ry="35" fill="url(#yellowGloss)"/>
      <path d="M820 420C877 435 945 442 1035 442C1120 442 1198 433 1277 418" stroke="#9A650A" stroke-opacity="0.18" stroke-width="10" stroke-linecap="round"/>
