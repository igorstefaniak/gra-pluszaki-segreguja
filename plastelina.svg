      <path d="M134 345C170 334 214 330 267 330H462C511 330 547 336 566 345" stroke="#A6241E" stroke-opacity="0.18" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="245" cy="323" rx="120" ry="34" fill="url(#redGloss)"/>
      <path d="M123 395C173 408 236 415 326 415C410 415 488 407 555 393" stroke="#8F201B" stroke-opacity="0.18" stroke-width="10" stroke-linecap="round"/>
