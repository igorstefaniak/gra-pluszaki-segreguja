    <radialGradient id="ground" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 655) rotate(90) scale(70 430)">
      <stop offset="0" stop-color="#7F9FD3" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7F9FD3" stop-opacity="0"/>
    </radialGradient>

    <!-- red -->
    <linearGradient id="redBase" x1="120" y1="290" x2="530" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8C88"/>
