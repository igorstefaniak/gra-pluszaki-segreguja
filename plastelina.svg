<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="180" y1="120" x2="1180" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>

    <filter id="shadow" x="40" y="180" width="1320" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
