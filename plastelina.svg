      <ellipse cx="598" cy="274" rx="132" ry="36" fill="url(#greenGloss)"/>
      <path d="M460 355C520 369 593 377 690 377C781 377 861 368 937 353" stroke="#115A24" stroke-opacity="0.18" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- yellow clay: ~16:4 -->
    <g transform="rotate(-6 1060 430)">
      <rect x="790" y="320" width="500" height="125" rx="62.5" fill="url(#yellowBase)"/>
      <path d="M830 347C862 331 910 324 975 324H1198C1234 324 1263 331 1285 343C1248 334 1214 332 1167 332H934C889 332 857 336 830 347Z" fill="#FFF1B5" fill-opacity="0.36"/>
