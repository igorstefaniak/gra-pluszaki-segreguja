      <stop offset="1" stop-color="#C92B24"/>
    </linearGradient>
    <linearGradient id="redGloss" x1="160" y1="285" x2="330" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD8D5" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFD8D5" stop-opacity="0"/>
    </linearGradient>

    <!-- green -->
    <linearGradient id="greenBase" x1="470" y1="255" x2="930" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8BE08E"/>
