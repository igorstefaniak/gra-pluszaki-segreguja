<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pluszaki segregują</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗑️</text></svg>">
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #29b6f6 0%, #81d4fa 50%, #9ccc65 50%, #4caf50 100%);
            height: 100vh;
        }

        #start-screen,
        #feedback-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            background: linear-gradient(to bottom, #29b6f6 0%, #81d4fa 50%, #9ccc65 50%, #4caf50 100%);
        }

        #feedback-screen {
            display: none;
            z-index: 300;
        }

        .big-bear-emoji {
            font-size: 150px;
            animation: wobble 2s infinite ease-in-out;
            margin-bottom: 20px;
            filter: drop-shadow(5px 5px 10px rgba(0, 0, 0, 0.2));
        }

        .bubble-text {
            background: #fff;
            border: 5px dashed #0288d1;
            border-radius: 30px;
            padding: 25px 40px;
            font-size: 32px;
            font-weight: bold;
            max-width: 600px;
            text-align: center;
            box-shadow: 6px 6px 0px #4fc3f7;
            line-height: 1.5;
            color: #01579b;
            white-space: pre-line;
        }

        #start-btn {
            background: #f4511e;
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 32px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 5px 5px 0px #bf360c;
            transition: transform 0.2s;
            border: 5px dashed #fff;
            margin-top: 30px;
        }

        #start-btn:active {
            transform: scale(0.95) translate(2px, 2px);
            box-shadow: 2px 2px 0px #bf360c;
        }

        #header {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 10px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            height: 80px;
            z-index: 100;
            position: relative;
        }

        #bear-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #bear {
            font-size: 45px;
            animation: wobble 2s infinite ease-in-out;
        }

        @keyframes wobble {

            0%,
            100% {
                transform: rotate(-5deg);
            }

            50% {
                transform: rotate(5deg) scale(1.1);
            }
        }

        #bubble {
            background: #fff;
            border: 3px dashed #03a9f4;
            border-radius: 15px;
            padding: 8px 15px;
            font-size: 18px;
            font-weight: bold;
            color: #0277bd;
            box-shadow: 3px 3px 0px #e1f5fe;
        }

        #score {
            font-size: 22px;
            color: #fff;
            font-weight: bold;
            background: #d81b60;
            padding: 8px 20px;
            border-radius: 20px;
            border: 3px dashed #fff;
            text-align: center;
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.1);
        }

        #remaining-box {
            font-size: 18px;
            color: #fff;
            font-weight: bold;
            background: #0288d1;
            padding: 8px 15px;
            border-radius: 15px;
            border: 2px dashed #fff;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
        }

        #game-area {
            position: relative;
            width: 100vw;
            height: calc(100vh - 100px);
            overflow: hidden;
            border-top: 6px dashed #fff;
        }

        .tree {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .tree-trunk {
            width: 25px;
            height: 70px;
            background: linear-gradient(to right, #6d4c41, #8d6e63);
            border-radius: 5px;
            z-index: 1;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
        }

        .tree-foliage {
            width: 140px;
            height: 130px;
            border-radius: 60% 40% 70% 30% / 50% 60% 40% 50%;
            background: linear-gradient(to bottom right, #66bb6a, #388e3c);
            margin-bottom: -25px;
            z-index: 2;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.15);
        }

        .tree-1 {
            left: 10%;
            bottom: 250px;
            transform: scale(0.8);
            z-index: 5;
        }

        .tree-2 {
            left: 45%;
            bottom: 300px;
            transform: scale(0.6);
            z-index: 4;
        }

        .tree-3 {
            right: 10%;
            bottom: 220px;
            transform: scale(1.1);
            z-index: 6;
        }

        #falling-item {
            position: absolute;
            cursor: grab;
            user-select: none;
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.3));
            z-index: 50;
            touch-action: none;
            top: 0;
            left: 0;
            transition: transform 0.1s linear;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        #falling-icon {
            font-size: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #falling-icon img {
            width: 80px;
            height: auto;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        #falling-label {
            font-size: 16px;
            font-weight: bold;
            background: rgba(255, 255, 255, 1);
            padding: 4px 10px;
            border-radius: 12px;
            margin-top: 5px;
            color: #333;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
            border: 2px solid #0288d1;
        }

        .bins-container {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: flex-end;
            z-index: 10;
        }

        .bin {
            width: 10vw;
            max-width: 80px;
            height: 120px;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 10px;
            font-weight: bold;
            font-size: 10px;
            position: relative;
            box-shadow: inset -10px 0 15px rgba(0, 0, 0, 0.2), 0 5px 10px rgba(0, 0, 0, 0.1);
            transition: filter 0.2s;
            text-align: center;
            word-wrap: break-word;
        }

        .bin::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -5px;
            right: -5px;
            height: 15px;
            border-radius: 5px;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.2);
            z-index: 2;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: right bottom;
        }

        .bin::after {
            content: '♻️';
            position: absolute;
            top: 30px;
            font-size: 25px;
            opacity: 0.3;
            pointer-events: none;
        }

        .bin.open {
            filter: brightness(1.1);
        }

        .bin.open::before {
            transform: rotate(30deg) translateY(-10px) translateX(5px);
        }

        .blue {
            background-color: #1976d2;
        }

        .blue::before {
            background-color: #1565c0;
        }

        .yellow {
            background-color: #fbc02d;
            color: #424242;
        }

        .yellow::before {
            background-color: #f9a825;
        }

        .green {
            background-color: #388e3c;
        }

        .green::before {
            background-color: #2e7d32;
        }

        .brown-real {
            background-color: #6d4c41;
        }

        .brown-real::before {
            background-color: #5d4037;
        }

        .black {
            background-color: #455a64;
        }

        .black::before {
            background-color: #37474f;
        }

        .orange {
            background-color: #f57c00;
        }

        .orange::before {
            background-color: #e65100;
        }

        .purple {
            background-color: #7b1fa2;
        }

        .purple::before {
            background-color: #4a148c;
        }

        .red {
            background-color: #d32f2f;
        }

        .red::before {
            background-color: #b71c1c;
        }

        .grey {
            background-color: #607d8b;
        }

        .grey::before {
            background-color: #455a64;
        }

        #win-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 400;
            background: radial-gradient(circle, #fff9c4 0%, #fff176 100%);
            overflow: hidden;
        }

        .win-content {
            text-align: center;
            z-index: 410;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .trophy {
            font-size: 150px;
            margin-bottom: 20px;
            display: inline-block;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-20px);
            }
        }

        #restart-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 8px 0 #2e7d32;
            transition: all 0.2s;
            margin-top: 30px;
            border: 4px solid #fff;
        }

        #restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #2e7d32;
        }

        #restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #2e7d32;
        }

        #continue-btn {
            background: #0288d1;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #01579b;
            transition: all 0.2s;
            margin-top: 20px;
            border: 3px solid #fff;
        }

        #continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #01579b;
        }

        #continue-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #01579b;
        }

        .bubble-info-text {
            background: #e1f5fe;
            border: 3px dashed #03a9f4;
            border-radius: 20px;
            padding: 15px 25px;
            font-size: 20px;
            font-weight: bold;
            max-width: 500px;
            text-align: center;
            box-shadow: 4px 4px 0px #b3e5fc;
            line-height: 1.4;
            color: #0277bd;
            margin-top: 15px;
        }

        .confetti {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #f00;
            z-index: 405;
            top: -20px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
            }
        }
    </style>
</head>

<body>

    <div id="start-screen">
        <div class="big-bear-emoji">🧸</div>
        <div class="bubble-text">Cześć! Jestem Miś. Pomóż mi posprzątać naszą polanę! Łap śmieci i wrzucaj je do koszy.
        </div>
        <button id="start-btn">Zaczynamy!</button>
    </div>

    <div id="feedback-screen">
        <div id="feedback-bear" class="big-bear-emoji">🧸</div>
        <div id="feedback-msg" class="bubble-text"></div>
        <div id="feedback-info" class="bubble-info-text"></div>
        <button id="continue-btn">Kontynuuj</button>
    </div>

    <div id="win-screen">
        <div class="win-content">
            <div class="trophy">🏆</div>
            <div class="bubble-text">Hurra! Cały las jest czysty! Jesteś mistrzem segregacji! 🌟</div>
            <button id="restart-btn">Zagraj jeszcze raz!</button>
        </div>
    </div>

    <div id="header">
        <div id="bear-box">
            <div id="bear">🧸</div>
            <div id="bubble">Łap w locie!</div>
        </div>
        <div id="remaining-box">Zostało: 0</div>
        <div id="score">⭐ 0</div>
    </div>

    <div id="game-area">
        <div class="tree tree-1">
            <div class="tree-foliage"></div>
            <div class="tree-trunk"></div>
        </div>
        <div class="tree tree-2">
            <div class="tree-foliage"></div>
            <div class="tree-trunk"></div>
        </div>
        <div class="tree tree-3">
            <div class="tree-foliage"></div>
            <div class="tree-trunk"></div>
        </div>

        <div id="falling-item">
            <div id="falling-icon"></div>
            <div id="falling-label"></div>
        </div>
        <div class="bins-container">
            <div class="bin blue" data-cat="papier">PAPIER</div>
            <div class="bin yellow" data-cat="plastik">PLASTIK</div>
            <div class="bin green" data-cat="szklo">SZKŁO</div>
            <div class="bin brown-real" data-cat="bio">BIO</div>
            <div class="bin black" data-cat="zmieszane">ZMIESZANE</div>
            <div class="bin orange" data-cat="niebezpieczne">NIEBEZPIECZNE</div>
            <div class="bin purple" data-cat="tekstylia">TEKSTYLIA</div>
            <div class="bin red" data-cat="elektrośmieci">ELEKTROŚMIECI</div>
            <div class="bin grey" data-cat="pszok">PSZOK</div>
        </div>
    </div>

    <script>
        const data = [
            { icon: '📦', name: 'Karton', cat: 'papier', info: 'Pudełka rozłóż na płasko – zajmą mniej miejsca w koszu!' },
            { icon: '🥤', name: 'Kubek po napoju', cat: 'plastik', info: 'Upewnij się, że kubek jest pusty przed wyrzuceniem.' },
            { icon: '📚', name: 'Książki', cat: ['papier', 'pszok'], info: 'Książki można oddać do PSZOK lub wrzucić do niebieskiego kosza (najlepiej bez twardych okładek).' },
            { icon: '✉️', name: 'Zwykła koperta', cat: ['papier', 'pszok'], info: 'Czyste papierowe koperty bez okienka wrzucamy do niebieskiego kosza.' },
            { icon: '🫙', name: 'Słoik', cat: 'szklo', info: 'Zdejmij zakrętkę – ona zazwyczaj trafia do plastiku i metalu!' },
            { icon: '🍌', name: 'Skórka', cat: 'bio', info: 'Z owoców powstanie kompost, który karmi rośliny.' },
            { icon: '🍞', name: 'Chleb', cat: 'bio', info: 'Stary chleb i pieczywo to odpady BIO.' },
            { icon: '🗞️', name: 'Gazeta', cat: 'papier', info: 'Z makulatury można zrobić nowy papier, oszczędzając drzewa.' },
            { icon: '🥫', name: 'Puszka', cat: 'plastik', info: 'Zgnieć puszkę, żeby nie zajmowała dużo miejsca.' },
            { icon: '🍎', name: 'Ogryzek', cat: 'bio', info: 'Bioodpady to świetny materiał na naturalny nawóz.' },
            { icon: '🍼', name: 'Butelka szklana', cat: 'szklo', info: 'Mycie butelek nie jest konieczne, wystarczy je opróżnić.' },
            { icon: '🦴', name: 'Kość', cat: 'zmieszane', info: 'Resztki mięsa i kości nie trafiają do BIO – wrzuć je tutaj.' },
            { icon: '📝', name: 'Zeszyt', cat: ['papier', 'pszok'], info: 'Pamiętaj, aby zdjąć plastikową okładkę przed wyrzuceniem.' },
            { icon: '🧴', name: 'Opakowanie po szamponie', cat: 'plastik', info: 'Puste butelki po kosmetykach to cenny surowiec.' },
            { icon: '🍬', name: 'Plastikowy papierek po cukierku', cat: 'plastik', info: 'Małe śmieci też są ważne – wrzuć je do żółtego kosza.' },
            { icon: '☕', name: 'Fusy', cat: 'bio', info: 'Fusy po kawie i herbacie to też odpady BIO!' },
            { icon: '🥛', name: 'Karton po mleku', cat: 'plastik', info: 'To nie tylko papier – to wielomateriałowe opakowanie (Tetra Pak).' },
            { icon: '🥚', name: 'Skorupki', cat: 'bio', info: 'Skorupki jajek są idealnym dodatkiem do kompostu.' },
            { icon: '🧹', name: 'Kurz', cat: 'zmieszane', info: 'Śmieci z odkurzacza zawsze trafiają do kosza czarnego.' },
            { icon: '🍂', name: 'Liście', cat: 'bio', info: 'Suche liście to idealny materiał na bio-energię.' },
            { icon: '🪵', name: 'Gałązki', cat: 'bio', info: 'Drewno z ogrodu to świetny składnik kompostownika.' },
            { icon: '🐟', name: 'Ryba', cat: 'zmieszane', info: 'Resztki ryb nie powinny trafiać do brązowego pojemnika.' },
            { icon: '🎨', name: 'Opakowanie po farbach', cat: ['niebezpieczne', 'pszok'], info: 'Resztki farb są niebezpieczne dla natury – oddaj je do PSZOK.' },
            { icon: '<img src="plastelina.svg" alt="Plastelina" draggable="false">', name: 'Plastelina', cat: 'zmieszane', info: 'Plastelina i modelina to odpady zmieszane – nie nadają się do recyklingu.' },
            { icon: '🛞', name: 'Stara opona', cat: 'pszok', info: 'Opony zawsze oddajemy do PSZOK lub punktów serwisowych.' },
            { icon: '🪑', name: 'Zepsute krzesło', cat: ['pszok', 'zmieszane'], info: 'Meble i gabaryty to odpady, które przyjmuje PSZOK.' },
            { icon: '👕', name: 'Ubrania', cat: ['tekstylia', 'pszok'], info: 'Stare ubrania można wrzucić do specjalnych kontenerów.' },
            { icon: '👟', name: 'Buty', cat: ['tekstylia', 'pszok'], info: 'Zniszczone buty oddaj do punktów zbiórki odzieży.' },
            { icon: '🧦', name: 'Skarpety', cat: ['tekstylia', 'pszok'], info: 'Nawet dziurawe skarpetki mogą zostać ponownie wykorzystane!' },
            { icon: '🔌', name: 'Ładowarka', cat: ['elektrośmieci', 'pszok'], info: 'Zepsute kable i ładowarki to odpady elektryczne.' },
            { icon: '🔋', name: 'Bateria', cat: ['elektrośmieci', 'pszok', 'niebezpieczne'], info: 'Nigdy nie wyrzucaj ich do zwykłego kosza! Szukaj pudełek w sklepie lub szkole.' },
            { icon: '💡', name: 'Żarówka', cat: ['elektrośmieci', 'pszok'], info: 'Zużyte żarówki zawierają substancje, które trzeba bezpiecznie przetworzyć.' },
            { icon: '📱', name: 'Smartfon', cat: ['elektrośmieci', 'pszok'], info: 'Stare telefony to elektrośmieci – oddaj je do PSZOK lub punktów zbiórki.' },
            { icon: '🧸', name: 'Zabawki pluszowe', cat: 'pszok', info: 'Zabawki pluszowe oddajemy do PSZOK.' },
            { icon: '🧾', name: 'Paragon', cat: 'zmieszane', info: 'Paragony to papier termiczny – nie nadają się do recyklingu, wyrzuć je do czarnego kosza.' },
            { icon: '🍽️', name: 'Zabrudzone naczynia jednorazowe', cat: 'zmieszane', info: 'Zabrudzone naczynia z plastiku wyrzucamy do czarnego kosza.' },
            { icon: '🖍️', name: 'Kredki', cat: 'zmieszane', info: 'Zużyte kredki świecowe i ołówkowe wyrzucamy do czarnego kosza.' },
            { icon: '✉️', name: 'Koperta z okienkiem', cat: 'zmieszane', info: 'Koperty z foliowym okienkiem wyrzucamy do czarnego kosza.' },
            { icon: '🩹', name: 'Plaster', cat: 'zmieszane', info: 'Zużyte materiały opatrunkowe to zawsze odpady zmieszane.' },
            { icon: '🧻', name: 'Papier toaletowy', cat: 'zmieszane', info: 'Brudny papier i chusteczki nie nadają się do recyklingu.' },
        ];

        let current = {};
        let points = 0;
        let y = -100;
        let x = 0;
        let speed = 0.5;
        let isDragging = false;
        let animationId;
        let isPaused = false;
        let remainingItems = [];
        let isRetry = false;
        let synth = window.speechSynthesis;

        const gameArea = document.getElementById('game-area');
        const itemEl = document.getElementById('falling-item');
        const iconEl = document.getElementById('falling-icon');
        const labelEl = document.getElementById('falling-label');
        const bins = document.querySelectorAll('.bin');
        const scoreDisplay = document.getElementById('score');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const feedbackScreen = document.getElementById('feedback-screen');
        const feedbackMsg = document.getElementById('feedback-msg');
        const feedbackBear = document.getElementById('feedback-bear');
        const feedbackInfo = document.getElementById('feedback-info');
        const continueBtn = document.getElementById('continue-btn');
        const winScreen = document.getElementById('win-screen');
        const restartBtn = document.getElementById('restart-btn');
        const remainingDisplay = document.getElementById('remaining-box');

        function initRemainingItems() {
            remainingItems = [...data].sort(() => Math.random() - 0.5);
            updateRemainingDisplay();
        }

        function updateRemainingDisplay() {
            remainingDisplay.innerText = "Zostało: " + remainingItems.length;
        }

        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            initRemainingItems();
            startSpawn();
            speak("Pomóż mi posprzątać naszą polanę! Łap śmieci i wrzucaj je do koszy.");
        });

        restartBtn.addEventListener('click', () => {
            winScreen.style.display = 'none';
            points = 0;
            scoreDisplay.innerText = "⭐ 0";
            initRemainingItems();
            startSpawn();
        });

        continueBtn.addEventListener('click', () => {
            feedbackScreen.style.display = 'none';
            isPaused = false;
            startSpawn();
        });

        function startSpawn() {
            if (isPaused) return;

            if (!isRetry) {
                if (remainingItems.length === 0) {
                    showWinScreen();
                    return;
                }
                current = remainingItems.pop();
                updateRemainingDisplay();
            }

            iconEl.innerHTML = current.icon;
            labelEl.innerText = current.name;

            const areaWidth = gameArea.clientWidth;
            x = Math.random() * (areaWidth - 100) + 10;
            y = -100;
            speed = 0.5 + (points * 0.03); // Slightly slower speed scaling for better balance

            itemEl.style.transform = `translate(${x}px, ${y}px)`;
            itemEl.style.display = 'flex';
            isDragging = false;

            loop();
        }

        function showWinScreen() {
            itemEl.style.display = 'none';
            winScreen.style.display = 'flex';
            speak("Hurra! Cały las jest czysty! Jesteś mistrzem segregacji!");
            createConfetti();
        }

        function speak(text) {
            if (!synth) return;
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'pl-PL';
            utter.pitch = 1.2;
            utter.rate = 1.0;
            synth.speak(utter);
        }

        function createConfetti() {
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4caf50', '#8bc34a', '#cddc39', '#ffeb3b', '#ffc107', '#ff9800', '#ff5722'];
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.animationDuration = Math.random() * 2 + 2 + 's';
                confetti.style.animationDelay = Math.random() * 3 + 's';
                winScreen.appendChild(confetti);
            }
        }

        function showFeedback(isCorrect) {
            isPaused = true;
            cancelAnimationFrame(animationId);
            itemEl.style.display = 'none';

            if (!isCorrect) {
                isRetry = true;
            } else {
                isRetry = false;
            }

            if (isCorrect) {
                feedbackMsg.innerText = "Brawo! Świetnie segregujesz! ✨";
                feedbackMsg.style.color = "#2e7d32";
                feedbackMsg.style.borderColor = "#4caf50";
                feedbackBear.innerText = "🥳";
            } else {
                feedbackMsg.innerText = "Ojej! To nie ten kosz. Spróbuj jeszcze raz! ❌";
                feedbackMsg.style.color = "#c62828";
                feedbackMsg.style.borderColor = "#e53935";
                feedbackBear.innerText = "😟";
            }

            feedbackInfo.innerText = current.info;
            speak(feedbackMsg.innerText + " " + feedbackInfo.innerText);

            feedbackScreen.style.display = 'flex';
        }

        function updateBinsOpenState(itemRect) {
            const itemCenterX = itemRect.left + (itemRect.width / 2);
            bins.forEach(bin => {
                const binRect = bin.getBoundingClientRect();
                if (itemCenterX > binRect.left - 20 && itemCenterX < binRect.right + 20 && itemRect.bottom > binRect.top - 80 && itemRect.top < binRect.bottom) {
                    bin.classList.add('open');
                } else {
                    bin.classList.remove('open');
                }
            });
        }

        function checkHit() {
            const itemRect = itemEl.getBoundingClientRect();
            const areaRect = gameArea.getBoundingClientRect();

            updateBinsOpenState(itemRect);

            if (isDragging) return false;

            if (itemRect.bottom >= areaRect.bottom - 120) {
                for (let bin of bins) {
                    const binRect = bin.getBoundingClientRect();
                    const itemCenterX = itemRect.left + (itemRect.width / 2);

                    if (itemCenterX > binRect.left && itemCenterX < binRect.right && itemRect.bottom > binRect.top) {
                        const binCat = bin.dataset.cat;
                        const correct = Array.isArray(current.cat)
                            ? current.cat.includes(binCat)
                            : current.cat === binCat;

                        points = correct ? points + 1 : Math.max(0, points - 1);
                        scoreDisplay.innerText = "⭐ " + points;
                        showFeedback(correct);
                        return true;
                    }
                }
            }

            if (itemRect.top > areaRect.bottom) {
                points = Math.max(0, points - 1);
                scoreDisplay.innerText = "⭐ " + points;
                showFeedback(false);
                return true;
            }

            return false;
        }

        function loop() {
            if (isPaused) return;
            if (!isDragging) {
                y += speed;
                itemEl.style.transform = `translate(${x}px, ${y}px)`;
            }

            if (!checkHit()) {
                animationId = requestAnimationFrame(loop);
            }
        }

        itemEl.addEventListener('pointerdown', (e) => {
            if (isPaused) return;
            isDragging = true;
            itemEl.setPointerCapture(e.pointerId);
        });

        itemEl.addEventListener('pointermove', (e) => {
            if (isDragging && !isPaused) {
                const areaRect = gameArea.getBoundingClientRect();
                x = e.clientX - areaRect.left - (itemEl.clientWidth / 2);
                y = e.clientY - areaRect.top - (itemEl.clientHeight / 2);
                itemEl.style.transform = `translate(${x}px, ${y}px)`;
                updateBinsOpenState(itemEl.getBoundingClientRect());
            }
        });

        itemEl.addEventListener('pointerup', (e) => {
            isDragging = false;
            if (!isPaused) itemEl.releasePointerCapture(e.pointerId);
        });
    </script>
</body>
